events {
    worker_connections 1024;
}

http {
    upstream vllm_service {
        server vllm:8000;
    }

    # NOTE: no static `upstream` for TTS. The active engine (kokoro OR
    # chatterbox, profile-gated and mutually exclusive) both answer at the
    # `text-to-speech` alias, but a static upstream is resolved once at
    # startup and would crash nginx ("host not found in upstream") whenever
    # that service is momentarily down. The /v1/audio/speech location below
    # resolves the alias lazily per-request via the embedded DNS resolver.

    upstream stt_service {
        server speech-to-text:6001;
    }

    server {
        listen 80;
        # TLS termination for selene.renman.wtf happens here directly (no
        # upstream proxy). Port 80 stays plain-HTTP with identical routing —
        # satellites (OTA), the companion app, and ntfy all use it on the LAN,
        # so no forced HTTPS redirect.
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/letsencrypt/live/selene.renman.wtf/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/selene.renman.wtf/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Re-resolve `agent` hostname against Docker's embedded DNS so nginx
        # picks up the new container IP after `docker compose restart agent`.
        resolver 127.0.0.11 valid=10s ipv6=off;

        location /health {
            access_log off;
            return 200 "AI Gateway healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Agent LLM endpoint (via Agent- NOT real OpenAI-compat
        # Accept OpenAI-compat request but only pulls latest message.
        # because the Agent handles conversation history...hacky)
        location /v1/chat/completions {
            set $agent_upstream "agent:6002";
            proxy_pass http://$agent_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # vLLM direct connect, no Agent but full OpenAI-compat)
        location /v2/chat/completions {
            proxy_pass http://vllm_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        
        location /v2/completions {
            proxy_pass http://vllm_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        # TODO: Serve v1 and v2? 
        location /v1/models {
            proxy_pass http://vllm_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # TTS endpoint. Lazy-resolve the `text-to-speech` alias (same pattern
        # as $agent_upstream above) so nginx starts even when the active TTS
        # engine is still booting, and picks up whichever engine (kokoro or
        # chatterbox) currently owns the alias.
        location /v1/audio/speech {
            set $tts_upstream "text-to-speech:6005";
            proxy_pass http://$tts_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 10M;
        }
        
        # STT endpoints
        location /v1/audio/transcriptions {
            proxy_pass http://stt_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 25M;
        }
        
        location /v1/audio/translations {
            proxy_pass http://stt_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 25M;
        }
        
        # Agent WebSocket
        location /ws/ {
            set $agent_upstream "agent:6002";
            proxy_pass http://$agent_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # Agent REST API
        location /api/ {
            set $agent_upstream "agent:6002";
            proxy_pass http://$agent_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            # /api/vision/ask accepts phone-camera photos (5-15 MB) and video
            # clips (a 3-min 1080p H.264 clip is ~150-200 MB; phone footage
            # at 10-15 Mbps can hit ~340 MB). 300 MB covers ~3 min of typical
            # 1080p phone video with margin while keeping a sane upper bound.
            # NOTE: bind-mount inode pitfall — atomic-save editors change the
            # inode, so the running container sees the OLD file until
            # `docker compose up -d --force-recreate nginx`. `restart` is not
            # enough.
            client_max_body_size 300M;
        }

        # MCP Streamable HTTP tool host (mcp-tools service). Same lazy-DNS
        # pattern as $agent_upstream. Responses are long-lived SSE streams:
        # buffering/gzip would stall them, and reads can legitimately idle
        # for a long time between events.
        location /mcp/ {
            set $mcp_upstream "mcp-tools:6010";
            proxy_pass http://$mcp_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            gzip off;
        }

        # Agent UI (legacy path, redirects to root SPA)
        location /agent/ {
            return 301 /;
        }

        # Satellite OTA firmware blobs — served straight from disk, no auth (LAN only).
        # Host path: ./volumes/firmware/   →   served at /firmware/
        # Whole-file GETs only (esp_https_ota); no autoindex, no compression.
        location /firmware/ {
            alias /usr/share/havencore/firmware/;
            default_type application/octet-stream;
            types { application/json json; }
            autoindex off;
            gzip off;
        }

        # ntfy/UnifiedPush server for companion-app push notifications.
        # ntfy refuses sub-path hosting (its web UI uses absolute asset
        # paths), so this is a 301 redirect to the :8585 host port,
        # not a reverse proxy. Phone-side ntfy app config and the
        # generated UnifiedPush endpoints both use http://<host>:8585
        # directly; this redirect is a humans-typing-in-browsers
        # convenience.
        location = /ntfy { return 301 $scheme://$host:8585/; }
        location /ntfy/ { return 301 $scheme://$host:8585/; }

        # SvelteKit SPA — catch-all fallback to agent service
        location / {
            set $agent_upstream "agent:6002";
            proxy_pass http://$agent_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}