# systemd drop-in for docker.service — wait for the LAN IP before dockerd
# restores containers.
#
# Why: compose publishes mcp-tools on "${HOST_IP_ADDRESS}:6010". On a cold boot
# where the DHCP lease arrives late (router still coming up), dockerd starts
# first, the bind fails with "cannot assign requested address", and Docker
# never retries a failed container *start* — mcp-tools stays Exited(255) and
# the agent runs with zero tools. Seen 2026-09-26 after a power loss.
#
# Install (once, as root):
#   sudo install -D -m 644 scripts/host/docker-wait-for-lan-ip.conf \
#     /etc/systemd/system/docker.service.d/wait-for-lan-ip.conf
#   sudo systemctl daemon-reload
#
# Edit the IP below if HOST_IP_ADDRESS in .env changes. Gives up after 20 min
# and lets dockerd start anyway so an unplugged box still boots.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 600); do ip -4 addr show 2>/dev/null | grep -q "inet 10\\.0\\.0\\.134/" && exit 0; sleep 2; done; echo "docker: LAN IP 10.0.0.134 never appeared, starting anyway"'
