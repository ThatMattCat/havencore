services:
  postgres:
    # Rollback digest (known-good 2026-04-12):
    #   postgres@sha256:fceb6f86328c36f2438fae3b851b0cc57c4a7e69a58c866d9ce24281f2cf0c9c
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U havencore -d havencore"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  nginx:
    # Rollback digest (known-good 2026-04-12):
    #   nginx@sha256:582c496ccf79d8aa6f8203a79d32aaf7ffd8b13362c60a701a2f9ac64886c93d
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Satellite OTA blobs — host-side scp target, served read-only at /firmware/
      - ./volumes/firmware:/usr/share/havencore/firmware:ro
      # TLS cert for selene.renman.wtf, issued/renewed by the certbot service.
      # nginx fails to start if the cert is missing — on a fresh host, run the
      # one-off `docker compose run --rm certbot certonly ...` first
      # (see docs/services/nginx/).
      - ./volumes/letsencrypt:/etc/letsencrypt:ro
    # Reload every 6h so renewed certs are picked up (certbot renews ~30 days
    # before expiry, so the lag is harmless). Note: a custom command skips the
    # nginx image's entrypoint.d scripts — fine, we mount our own nginx.conf.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'
    depends_on:
      agent:
        condition: service_healthy
      # No depends_on for the TTS service: it is now profile-gated (kokoro OR
      # chatterbox) and reached at the shared `text-to-speech` network alias.
      # nginx resolves that alias lazily per-request (see nginx.conf), so it
      # must NOT hard-depend on a specific TTS service — doing so would
      # auto-enable that engine's profile and break mutual exclusivity.
      speech-to-text:
        condition: service_started
    restart: unless-stopped
  certbot:
    # Issues/renews the selene.renman.wtf TLS cert via Cloudflare DNS-01, so
    # no public DNS record or port-forward is needed (the name is LAN-only).
    # Credentials: ./volumes/letsencrypt/cloudflare.ini (chmod 600, gitignored)
    # containing `dns_cloudflare_api_token = <Zone:DNS:Edit token>`.
    # First issuance is a one-off (see docs/services/nginx/). NOTE the
    # --entrypoint override — without it, `compose run` keeps this service's
    # renew-loop entrypoint and silently ignores the certonly args:
    #   docker compose run --rm --entrypoint certbot certbot certonly \
    #     --dns-cloudflare \
    #     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
    #     -d selene.renman.wtf --register-unsafely-without-email --agree-tos -n
    # This service then just re-checks every 12h; nginx's 6h reload loop picks
    # up renewed certs without any cross-container hook.
    image: certbot/dns-cloudflare:latest
    volumes:
      - ./volumes/letsencrypt:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'
    restart: unless-stopped
  agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    image: agent:${VERSION:-latest}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Agent's startup blocks on detecting the vLLM model (see selene_agent.py
      # :_detect_model), which can take 10-15 min on a cold cache. Until the
      # lifespan yields, /health isn't served — so keep the grace period wide
      # enough that dependents (nginx) don't give up during a cold `compose up`.
      start_period: 900s
    volumes:
      - ./services/agent/:/app
      - github_repo_clone:/var/cache/havencore/repo_clone
      # - ./shared:/app/shared:ro
    ports:
      - "6002:6002" # FastAPI: UI, API, and OpenAI-compat endpoints
    depends_on:
      postgres:
        condition: service_healthy
      # The agent's MCP client connects to mcp-tools over Streamable HTTP at
      # startup (30s per-server timeout) — wait until the tool host is up.
      mcp-tools:
        condition: service_healthy
    restart: unless-stopped
  mcp-tools:
    # MCP Streamable HTTP tool host — serves all 11 in-tree MCP tool modules
    # from one Starlette app (one mount per module at /mcp/<name>, per-mount
    # static bearer tokens from MCP_TOKEN_*). Reuses the agent image: same
    # code, different entrypoint. See selene_agent/mcp_http_app.py.
    image: agent:${VERSION:-latest}
    command: ["python", "-m", "selene_agent.mcp_http_app"]
    env_file:
      - .env
    environment:
      # The reminder module defaults to http://localhost:6002, which is only
      # correct inside the agent container — point it at the agent service.
      - AGENT_API_BASE=http://agent:6002
    volumes:
      - ./services/agent/:/app
      # github module's container-managed clone — same named volume as agent.
      - github_repo_clone:/var/cache/havencore/repo_clone
    ports:
      # LAN-IP-scoped on purpose: loopback 6010 on this host is held by an
      # SSH port-forward, so a 0.0.0.0 bind fails. LAN access (testing,
      # other machines) is what the published port is for anyway.
      #
      # Boot-order gotcha: if dockerd restores this container before the DHCP
      # lease for HOST_IP_ADDRESS lands, the bind fails with "cannot assign
      # requested address" and Docker does NOT retry a failed *start* (the
      # container sits at Exited 255 until `docker compose up -d mcp-tools`).
      # Fix on the host with the docker.service drop-in in
      # scripts/host/docker-wait-for-lan-ip.conf.
      - "${HOST_IP_ADDRESS}:6010:6010" # MCP Streamable HTTP mounts + /health
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6010/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Module init runs before uvicorn binds; the github module's clone/fetch
      # can block startup for minutes on a cold volume.
      start_period: 360s
    restart: unless-stopped
  speech-to-text:
    build:
      context: ./services/speech-to-text
      dockerfile: Dockerfile
    image: speech-to-text:${VERSION:-latest}
    volumes:
      - ./services/speech-to-text/app:/app
      - ./shared:/app/shared:ro
    ports:
      - "6001:6001" # /v1/audio/transcriptions OpenAI-compat API
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
  text-to-speech:
    # Chatterbox-Turbo TTS (Resemble AI) — expressive zero-shot voice cloning
    # with inline paralinguistic tags. Exposes an OpenAI-compatible
    # /v1/audio/speech surface plus an X-Visemes response header for
    # client-side avatar lip-sync. Pinned to a single GPU via
    # CUDA_VISIBLE_DEVICES (same pattern as vllm-vision / face-recognition);
    # ~1.5-2 GB peak VRAM for single-user inference.
    #
    # Profile-gated: only starts when COMPOSE_PROFILES=chatterbox. The default
    # deployment runs Kokoro (text-to-speech-kokoro) instead — set both
    # COMPOSE_PROFILES=chatterbox and TTS_PROVIDER=chatterbox to switch. The
    # two engines are mutually exclusive; both answer at the `text-to-speech`
    # network alias so nginx / the agent reach whichever one is active.
    profiles: ["chatterbox"]
    build:
      context: ./services/text-to-speech
      dockerfile: Dockerfile
    image: text-to-speech:${VERSION:-latest}
    ports:
      - "6005:6005" # OpenAI API-compatible /v1/audio/speech
    env_file:
      - .env
    environment:
      - CUDA_VISIBLE_DEVICES=${CHATTERBOX_GPU:-0}
      # Single-user TTS allocates a small model (~3 GB) then grows activations
      # per request. Expandable segments cut peak resident by ~10-20% on the
      # 3090s — important when sharing a GPU with vLLM/embeddings.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6005/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Chatterbox-Turbo cold-start: model load to GPU plus first-call CUDA
      # graph compilation can take 30-60s on a 3090.
      start_period: 120s
    deploy:
      resources:
        reservations: # GPU device selected via CUDA_VISIBLE_DEVICES env var
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./services/text-to-speech/app:/app
      - ./services/text-to-speech/voices:/app/voices
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./shared:/app/shared:ro
    restart: unless-stopped
  text-to-speech-kokoro:
    # Kokoro v1 TTS (hexgrad/Kokoro-82M) — small, fast, low-latency. The
    # default TTS engine. Same OpenAI-compatible /v1/audio/speech surface and
    # X-Visemes response header (Rhubarb, provider-independent) as Chatterbox,
    # but NO streaming / voice-cloning endpoints (fixed model voices). The
    # agent gates those off via TTS_PROVIDER=kokoro.
    #
    # Profile-gated: starts when COMPOSE_PROFILES=kokoro (the default). Claims
    # the `text-to-speech` network alias so nginx and the agent reach it at the
    # same hostname as Chatterbox — the two engines are mutually exclusive.
    profiles: ["kokoro"]
    build:
      context: ./services/text-to-speech-kokoro
      dockerfile: Dockerfile
    image: text-to-speech-kokoro:${VERSION:-latest}
    ports:
      - "6015:6005" # host 6015 -> container 6005 (avoids a clash if both engines are ever up)
    env_file:
      - .env
    environment:
      - CUDA_VISIBLE_DEVICES=${TTS_KOKORO_GPU:-0}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6005/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Kokoro is an 82M model — cold start is fast, but the first HF download
      # of the weights on a cold cache can take a minute.
      start_period: 120s
    deploy:
      resources:
        reservations: # GPU device selected via CUDA_VISIBLE_DEVICES env var
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      default:
        # Both TTS engines answer at `text-to-speech` so consumers (nginx
        # upstream, agent TTS_BASE_URL) need no per-engine hostname. Safe only
        # because the two are mutually exclusive (one profile active at a time).
        aliases:
          - text-to-speech
    volumes:
      - ./services/text-to-speech-kokoro/app:/app
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./shared:/app/shared:ro
    restart: unless-stopped
  vllm:
    # Pinned to the `qwen38-cu129` special-release image (pushed 2026-08-12) —
    # the dedicated vLLM build with Qwen3.8 hybrid-attention support, and the
    # digest Qwen3.8-27B was known-good on before the Flash-Next detour. The
    # cu129 (CUDA 12.9) variant is deliberate: our host driver is 580.x.
    # Rollback digests:
    #   Qwen3.8-Flash-Next (`qwen38-flash-next-x86_64-cu130`, pushed 2026-08-26):
    #     vllm/vllm-openai@sha256:0aea30240f3e3d9ffae8526643950e170eb5fa07fc427016a9dd90892afa2aa3
    #   vLLM v0.19.0 (known-good with GLM-4.5-Air):
    #     vllm/vllm-openai@sha256:d9a5c1c1614c959fde8d2a4d68449db184572528a6055afdd0caf1e66fb51504
    image: vllm/vllm-openai@sha256:3879c346b0866fe8e1894243bb4fcdfc38f8dfcdb8a710a3b1d456ce4e799999
    runtime: nvidia
    # profiles: ["vllm"]   # (always on; unlike vllm-vision below, which is profile-gated)
    env_file:
      - .env
    environment:
      # Resolve the model from the local HF cache only. Without this, vLLM
      # contacts huggingface.co at startup and crash-loops (exit 1 every ~20s)
      # when the host boots before internet/DNS is back (2026-09-26 outage:
      # 71 restarts, 22 min). Set HF_HUB_OFFLINE=0 in .env once to pull a new
      # model, then flip it back.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      # GPUs 0-3 are this service's; GPU 4 hosts the helpers (STT/TTS/
      # embeddings/face/ComfyUI). Hide it so no TP rank lands on it.
      - CUDA_VISIBLE_DEVICES=0,1,2,3
    # tini as PID 1: a hung `vllm serve` otherwise becomes an unkillable
    # zombie that `docker compose stop` refuses ("PID ... is zombie").
    init: true
    ports:
      - "8000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./services/vllm/app:/app
    ipc: host
    # Rollback command (pairs with the v0.19.0 rollback digest above):
    #   --model QuantTrio/GLM-4.5-Air-AWQ-FP16Mix --served-model-name gpt-3.5-turbo
    #   --tensor-parallel-size 4 --enable-expert-parallel --max-model-len 46080
    #   --max-num-seqs 2 --gpu-memory-utilization 0.79 --tool-call-parser glm45
    #   --reasoning-parser glm45 --enable-auto-tool-choice --trust-remote-code
    #   --host 0.0.0.0 --port 8000
    #
    # Rollback command (pairs with the `qwen38-flash-next-x86_64-cu130` digest
    # above; MoE INT4 quant, ~18.2 GiB/GPU weights, 98k context, ~84 tok/s).
    # Dropped 2026-09-28 for answer quality (uncalibrated RTN quant with INT4
    # attention; false "misspelled" claims, weak long agent loops):
    #   --model VnimanieAI/Qwen3.8-Flash-Next-W4A16 --served-model-name gpt-3.5-turbo
    #   --tensor-parallel-size 4 --enable-expert-parallel --max-model-len 98304
    #   --max-num-seqs 64 --limit-mm-per-prompt '{"image": 2, "video": 1}'
    #   --mm-processor-kwargs '{"size": {"longest_edge": 2097152, "shortest_edge": 65536}}'
    #   --gpu-memory-utilization 0.94
    #   --compilation-config '{"mode": 0, "cudagraph_mode": "FULL_DECODE_ONLY"}'
    #   --tool-call-parser qwen3_coder --reasoning-parser qwen3
    #   --enable-auto-tool-choice --trust-remote-code --host 0.0.0.0 --port 8000
    # It also needs, on the service: environment VLLM_PLE_CPU_OFFLOAD=1
    # (~102 GB of PLE tables in host RAM), VLLM_USE_V2_MODEL_RUNNER=0 and
    # TORCH_COMPILE_DISABLE=1 (both cure boot deadlocks on this host),
    # PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True, plus
    # `cap_add: [SYS_PTRACE]` and `security_opt: [seccomp=unconfined]`.
    # Full write-up: docs/services/vllm/README.md.
    #
    # Qwen3.8-27B notes:
    # - Unquantized BF16 (55.6 GB on disk, 13.11 GiB/GPU at tp=4). FP8 checkpoint
    #   exists but 3090s (SM86) have no native FP8; BF16 is the max-quality fit.
    # - Dense hybrid-attention model (48/64 layers Gated DeltaNet linear attn,
    #   16 full-attn @ 4 KV heads) — NOT MoE, so no --enable-expert-parallel.
    #   KV cost is only ~64 KB/token, so the full native 262144 context fits:
    #   ~16.8 GB KV for one max-length sequence (~4.2 GB/GPU at tp=4) on top of
    #   the weights. Measured at 0.90: 7.52 GiB/GPU of KV = 482,775 tokens
    #   (1.84x concurrency at 262k), ~44 tok/s decode, cold start ~5.5 min.
    #   Concurrent sequences share the pool — several at full context won't
    #   fit, which is fine for this household.
    # - Vision: the checkpoint is multimodal (27-layer ViT, ~461M params,
    #   image + video), and this instance is the agent's vision backend
    #   (VISION_API_BASE/VISION_SERVED_NAME in .env), so there is NO
    #   --language-model-only and the separate vllm-vision service stays
    #   profile-gated off. --limit-mm-per-prompt image:2 is what
    #   compare_snapshots needs (vLLM default is 1); the --mm-processor-kwargs
    #   size cap bounds each image to ~2 MP (~2k tokens, a full 1080p
    #   snapshot) so memory profiling and KV don't balloon. Vision calls pass
    #   chat_template_kwargs enable_thinking=false (see
    #   VISION_CHAT_TEMPLATE_KWARGS) so the small vision max_tokens budget
    #   isn't spent on the think block.
    # - gpu-memory-utilization 0.90: GPUs 0-3 are dedicated now (the old 0.80
    #   dated from when the helpers shared these cards), and the vision tower
    #   + image profiling need room the text-only config didn't.
    # - max-num-seqs 4: chat, autonomy turns and vision calls all land here.
    # - Built-in MTP draft head available later via --speculative-config.
    command: >
      --model Qwen/Qwen3.8-27B
      --served-model-name gpt-3.5-turbo
      --tensor-parallel-size 4
      --max-model-len 262144
      --max-num-seqs 4
      --limit-mm-per-prompt '{"image": 2, "video": 1}'
      --mm-processor-kwargs '{"size": {"longest_edge": 2097152, "shortest_edge": 65536}}'
      --gpu-memory-utilization 0.90
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --host 0.0.0.0
      --port 8000

    healthcheck:
      # /health works with or without --api-key auth, so re-enabling the
      # flag later won't break the healthcheck (/v1/models would 401).
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 2000s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
  vllm-vision:
    # vLLM 0.19.0 (the main `vllm` service is on a newer special-release
    # digest), verified on NVIDIA driver 580.x. Above the 0.11.0 minimum
    # required for Qwen3-VL support.
    image: vllm/vllm-openai@sha256:d9a5c1c1614c959fde8d2a4d68449db184572528a6055afdd0caf1e66fb51504
    # Shelved 2026-09-26 — the chat model (`vllm` above) is
    # multimodal and now serves vision, so this second instance is off by
    # default. Re-enable by adding `vllm-vision` to COMPOSE_PROFILES in .env
    # (e.g. COMPOSE_PROFILES="kokoro,vllm-vision") and pointing
    # VISION_API_BASE (:8001) / VISION_SERVED_NAME (gpt-4-vision) back at it.
    # Keeping it off frees ~10.5 GiB on GPU 4 for ComfyUI and the helpers.
    profiles: ["vllm-vision"]
    runtime: nvidia
    env_file:
      - .env
    environment:
      # Pin to the dedicated 5th RTX 3090. count:all under deploy.resources is
      # required for the nvidia runtime to expose GPUs into the container; the
      # actual selection happens via CUDA_VISIBLE_DEVICES (same pattern as
      # face-recognition).
      - CUDA_VISIBLE_DEVICES=4
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Same rationale as the `vllm` service: don't depend on internet at boot.
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
    ports:
      - "8001:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./services/vllm-vision/app:/app
    ipc: host
    # All tunables come from .env so the model + flags can be swapped (32B-AWQ
    # → 30B-A3B-AWQ → 8B-AWQ) without editing this file. See the VISION block
    # in .env.example and docs/services/vllm-vision/README.md.
    command: >
      --model ${VISION_MODEL:-QuantTrio/Qwen3-VL-32B-Instruct-AWQ}
      --served-model-name ${VISION_SERVED_NAME:-gpt-4-vision}
      --max-model-len ${VISION_MAX_MODEL_LEN:-16384}
      --max-num-seqs ${VISION_MAX_NUM_SEQS:-2}
      --gpu-memory-utilization ${VISION_GPU_MEM_UTIL:-0.92}
      --kv-cache-dtype fp8_e4m3
      --limit-mm-per-prompt '{"image": 4, "video": 1}'
      --trust-remote-code
      --host 0.0.0.0
      --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 1200s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
  mosquitto:
    # Rollback digest (known-good 2026-04-12):
    #   eclipse-mosquitto@sha256:9cfdd46ad59f3e3e5f592f6baf57ab23e1ad00605509d0f5c1e9b179c5314d87
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "1883:1883"    # MQTT port
      - "9001:9001"    # Websocket port (optional, useful for web clients)
    volumes:
      - ./services/mosquitto/config:/mosquitto/config
      - ./services/mosquitto/data:/mosquitto/data
      - ./services/mosquitto/log:/mosquitto/log
    # healthcheck:
    #   test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  text-to-image:
    build:
      context: ./services/text-to-image
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8188:8188"  # UI and API port
    volumes:
      # Model directories - mount your existing models here
      - ./services/text-to-image/models:/app/models
      - ./services/text-to-image/output:/app/output
      - ./services/text-to-image/input:/app/input
      - ./services/text-to-image/custom_nodes:/app/custom_nodes
      # - ./services/text-to-image/cache:/root/.cache

    # The image's CMD hardcodes `--default-device 3`. ComfyUI (or one of its
    # custom nodes) still opens a CUDA context on host GPU 0 when pinned via
    # CUDA_VISIBLE_DEVICES alone, so the host GPU is isolated at the Docker
    # level with device_ids below — the container sees exactly one device (0).
    command: ["python3", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--default-device", "0"]
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Optional: Set GPU memory limit (in MB)
      # - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      
      # Optional: Enable xformers for memory efficiency
      # - COMMANDLINE_ARGS=--use-pytorch-cross-attention
      
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TEXT_TO_IMAGE_GPU:-3}"]
              capabilities: [gpu]
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8188/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  comfyui-manager-installer:
    image: alpine:latest
    container_name: comfyui-manager-installer
    volumes:
      - ./services/text-to-image/custom_nodes:/custom_nodes
    entrypoint: /bin/sh
    command: -c "apk add --no-cache git && if [ ! -d /custom_nodes/ComfyUI-Manager ]; then git clone https://github.com/ltdrdata/ComfyUI-Manager.git /custom_nodes/ComfyUI-Manager; fi"

  # llamacpp:
  #   image: ghcr.io/ggml-org/llama.cpp:server-cuda-backup-20250816
  #   volumes:
