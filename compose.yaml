  qdrant:
    # Rollback digest (known-good 2026-04-12):
    #   qdrant/qdrant@sha256:94728574965d17c6485dd361aa3c0818b325b9016dac5ea6afec7b4b2700865f
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC (optional)
    volumes:
      - ./volumes/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
  face-recognition:
    # InsightFace buffalo_l (RetinaFace + ArcFace); host GPU from FACE_RECOGNITION_GPU.
    # Volume-mounted app dir so step-by-step changes don't require a rebuild.
    # CUDA_VISIBLE_DEVICES pins the host GPU; ctx_id=0 inside the container.
    build:
      context: ./services/face-recognition
      dockerfile: Dockerfile
    image: face-recognition:${VERSION:-latest}
    env_file:
      - .env
    ports:
      - "6006:6006"
    environment:
      - CUDA_VISIBLE_DEVICES=${FACE_RECOGNITION_GPU:-3}
    volumes:
      - ./services/face-recognition/app:/app
      - ./volumes/face_snapshots:/data/snapshots
      - ./volumes/insightface_models:/root/.insightface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6006/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # buffalo_l is small (~600MB), but first run downloads the model pack.
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  signal-api:
    # signal-cli-rest-api — outbound-only bridge to Signal's servers.
    # Bound to 127.0.0.1 so the QR-link endpoint is reachable from the host
    # during one-time device linking, but never from the internet.
    # MODE=native: signal-cli-native (GraalVM) persistent daemon — required
    # for reliable device linking. MODE=normal spawns signal-cli per-request
    # and the QR-link handshake races the process lifecycle.
    image: bbernhard/signal-cli-rest-api:latest
    environment:
      - MODE=native
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./volumes/signal-cli-config:/home/.local/share/signal-cli
    restart: unless-stopped

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:1.8
    ports:
      - "3000:3000"
    volumes:
      - ./volumes/models:/data
    environment:
      - MODEL_ID=BAAI/bge-large-en-v1.5
      - PORT=3000
      - CUDA_VISIBLE_DEVICES=${EMBEDDINGS_GPU:-0}  # host GPU index (see .env)
    deploy:
      resources:
        reservations: # GPU Device to use is configured in shared_config.py
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # UnifiedPush server for companion-app push notifications. The ntfy
  # Android app (the user's UnifiedPush distributor) holds a long-lived
  # WebSocket here; the agent's NtfyFanoutNotifier POSTs autonomy
  # payloads to per-device endpoint URLs.
  #
  # Canonical URL is http://<HOST_IP_ADDRESS>:8585 — the phone-side
  # ntfy app uses it as its server URL and ntfy itself emits it as the
  # base of every generated UnifiedPush endpoint. ntfy refuses
  # sub-path hosting (its web UI uses absolute asset paths), so nginx
  # provides only a 301 from /ntfy → :8585 as a memorability
  # shortcut for humans typing in browsers.
  #
  # LAN-only, no auth — fine for a self-hosted household stack. See
  # docs/integrations/companion-app.md.
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    environment:
      - TZ=${CURRENT_TIMEZONE:-America/Los_Angeles}
      - NTFY_BASE_URL=http://${HOST_IP_ADDRESS}:8585
      - NTFY_BEHIND_PROXY=false
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_CACHE_DURATION=12h
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
    volumes:
      - ./volumes/ntfy/cache:/var/cache/ntfy
      - ./volumes/ntfy/lib:/var/lib/ntfy
    ports:
      - "8585:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:80/v1/health 2>/dev/null | grep -q healthy || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  github_repo_clone:
